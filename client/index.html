<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Nhỏ Cuộc Sống - gocnhocuocsong.io | Game Mô Phỏng Cuộc Đời 2D Pixel</title>
    
    <!-- GOOGLE FONT RETRO PIXEL VT323 DUY NHẤT (100% KHÔNG DÙNG FONT TRÒN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <!-- CÁC MODULE CSS -->
    <link rel="stylesheet" href="css/giaoDienChinh.css">
    <link rel="stylesheet" href="css/gioiThieu.css">
    <link rel="stylesheet" href="css/dienThoaiAo.css">
    <link rel="stylesheet" href="css/khungChienDau.css">
</head>
<body>

    <!-- THANH HEADER ĐIỀU HƯỚNG CHUNG (100% FONT PIXEL VT323) -->
    <header class="thanh-header">
        <div class="header-container">
            <a href="#gioiThieu" class="logo-khoi">
                <div class="logo-badge">[ 32x32 ]</div>
                <div>
                    <div class="logo-text-chinh">GÓC NHỎ CUỘC SỐNG</div>
                    <div class="logo-text-phu">GOCNHOCUOCSONG.IO - MÔ PHỎNG ĐỜI THỰC VIỆT NAM</div>
                </div>
            </a>
            <nav class="menu-header">
                <a href="#gioiThieu" class="nut-pixel">GIỚI THIỆU</a>
                <a href="#game" class="nut-pixel cam">VÀO GAME DEMO</a>
                <button class="nut-pixel" onclick="if(window.moModalGDDGlobal) window.moModalGDDGlobal('mod1');">TÀI LIỆU GDD</button>
                <button class="nut-pixel" onclick="if(window.moModalQuyTacGlobal) window.moModalQuyTacGlobal();">QUY TẮC DỰ ÁN</button>
            </nav>
        </div>
    </header>

    <!-- ĐIỂM CẮM TEMPLATE VIEW THEO ROUTE AUTO-PICK -->
    <main id="ungDung">
        <!-- Template tương ứng sẽ được dieuHuongController tự động nạp vào đây -->
    </main>

    <!-- CHÂN TRANG FOOTER CHUNG -->
    <footer class="footer-du-an">
        <div class="footer-noi-dung">
            <div>
                <strong>GÓC NHỎ CUỘC SỐNG</strong> &copy; 2026 | TÊN MIỀN: <strong>gocnhocuocsong.io</strong>
            </div>
            <div>
                KIẾN TRÚC: CLIENT MVC ROUTER + HTML5 CANVAS 2D + PHP REST API | PIXEL PERFECT 32x32
            </div>
        </div>
    </footer>

    <!-- SCRIPTS MÔ HÌNH MVC -->
    <!-- 1. Bộ vẽ Asset Pixel 16x16 & 32x32 Canvas -->
    <script src="js/views/showcasePixel.js"></script>

    <!-- 2. Các Template View -->
    <script src="js/views/gioiThieuView.js"></script>
    <script src="js/views/gameView.js"></script>

    <!-- 3. Bộ Điều Hướng Router Tự Động Pick Route -->
    <script src="js/controllers/dieuHuongController.js"></script>
</body>
</html>
